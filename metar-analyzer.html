<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METAR Analyzer · Weather machine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260929" />
    <link rel="stylesheet" href="dark-theme.css?v=20260929" />
    <style>
      body{background:linear-gradient(rgba(246,245,239,.9),rgba(246,245,239,.95))}.metar-screen{max-width:1240px;margin:auto;padding:50px 42px 80px}.metar-header{display:flex;justify-content:space-between;align-items:end;gap:26px;border-bottom:1px solid var(--ink);padding-bottom:20px}.metar-header h1{margin:10px 0 0;font-family:'Libre Baskerville',Georgia,serif;font-size:clamp(42px,6vw,74px);font-weight:400;line-height:.95;letter-spacing:-.06em;color:#2d3b16}.metar-header p{max-width:380px;text-align:right;margin:0;color:var(--muted);font-size:13px;line-height:1.55}.metar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:25px;padding:14px 0;border-bottom:1px solid var(--line)}.metar-status{margin:0;color:var(--muted);font:400 11px/1.5 'DM Mono',monospace}.metar-toolbar button{border:0;background:var(--lime);padding:10px 14px;color:var(--ink);font:600 12px 'DM Sans',sans-serif;cursor:pointer}.metar-toolbar button:hover{background:#c8eb43}.metar-table-wrap{overflow:auto;border-bottom:1px solid var(--ink)}.metar-table{width:100%;min-width:760px;border-collapse:collapse}.metar-table th,.metar-table td{text-align:left;padding:14px;vertical-align:top}.metar-table th{font:500 10px 'DM Mono',monospace;letter-spacing:.08em}.metar-table td{font:500 12px/1.55 'DM Mono',monospace}.metar-table tr.risk-row.concern{box-shadow:inset 4px 0 #b79536}.metar-table tr.risk-row.bad{box-shadow:inset 4px 0 #c65d3d}.metar-table tr.risk-row.severe{box-shadow:inset 4px 0 #b94137}.metar-icao{font-weight:700;color:var(--ink)}.metar-raw{font-weight:700}.metar-raw.concern{color:#926e1a}.metar-raw.bad{color:#c65d3d}.metar-raw.severe{color:#b94137}.minima-note{display:block;margin-top:5px;color:#c23a86;font:700 9px/1.4 'DM Mono',monospace}.approach-badge{display:inline-block;margin:5px 0 0;padding:3px 6px;border:1px solid currentColor;border-radius:2px;font:700 9px/1.2 'DM Mono',monospace}.approach-badge.cat2{color:#367e9e;background:rgba(54,126,158,.12)}.approach-badge.cat3{color:#715aa8;background:rgba(113,90,168,.12)}.approach-badge.below-cat3{color:#c23a86;background:rgba(194,58,134,.12)}.approach-badge.no-ils{color:#a36b22;background:rgba(163,107,34,.12)}.metar-key{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font:400 10px 'DM Mono',monospace}.metar-key span{display:flex;align-items:center;gap:5px}.metar-key i{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor}.metar-key .concern{color:#b79536}.metar-key .bad{color:#c65d3d}.metar-key .severe{color:#b94137}.screen-note{margin:24px 0 0;color:var(--muted);font-size:12px;line-height:1.55}@media(max-width:760px){.metar-screen{padding:35px 20px}.metar-header{display:block}.metar-header p{margin-top:15px;text-align:left}.metar-toolbar{align-items:stretch;flex-direction:column}.metar-toolbar button{min-height:40px}}
    </style>
    <style>
      .metar-table tr.risk-row.concern{box-shadow:inset 4px 0 #F6C344}.metar-table tr.risk-row.bad{box-shadow:inset 4px 0 #FF8A3D}.metar-table tr.risk-row.severe{box-shadow:inset 4px 0 #FF3B5C}.metar-raw.concern,.metar-key .concern{color:#F6C344}.metar-raw.bad,.metar-key .bad{color:#FF8A3D}.metar-raw.severe,.metar-key .severe{color:#FF3B5C}
    </style>
  </head>
  <body>
    <main class="metar-screen">
      <header class="metar-header">
        <div>
          <div class="eyebrow"><span></span> AUTOMATED AVIATION OBSERVATION SCREEN</div>
          <h1>METAR<br />Analyzer</h1>
        </div>
        <p>Live screen of only the airports in the landing-minima sheet that meet a Marginal, Bad, or Severe weather condition.</p>
      </header>
      <div class="metar-toolbar"><p id="metarScreenStatus" class="metar-status" aria-live="polite">Starting automated METAR screen…</p><button id="refreshMetarScreen" type="button">Refresh now</button></div>
      <div class="metar-table-wrap"><table class="metar-table"><thead><tr><th>Visibility</th><th>Raw METAR</th></tr></thead><tbody id="metarScreenBody"><tr><td colspan="2">Loading live METAR screen…</td></tr></tbody></table></div>
      <div class="metar-key" aria-label="Weather-category colours"><span class="concern"><i></i>Marginal</span><span class="bad"><i></i>Bad</span><span class="severe"><i></i>Severe</span></div>
    </main>
    <script src="weather-analyzer.js?v=20261003-updated-rules-v13"></script>
    <script src="metar-analyzer.js?v=20261001-v3"></script>
  </body>
</html>
