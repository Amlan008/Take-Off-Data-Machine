name: Build surface and upper-air observation charts

on:
  workflow_dispatch:
  schedule:
    # Publish each three-hour surface slot after reports have arrived.
    # The builder also refreshes the latest nominal 00/12 UTC sounding chart.
    - cron: '47 1,4,7,10,13,16,19,22 * * *'

permissions:
  contents: write

concurrency:
  group: observation-charts
  cancel-in-progress: false

jobs:
  build-observation-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install observation decoding and contour support
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-observation-charts.txt
      - name: Check decoders and synoptic diagnostic rules
        run: |
          python scripts/test_observation_charts.py
          python scripts/test_synoptic_features.py
      - name: Build surface, upper-air and synoptic diagnostics
        run: python scripts/build_observation_charts.py
      - name: Commit generated observation charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/observation-charts
          git diff --cached --quiet || git commit -m 'Update surface and upper-air observation charts'
          git push
