name: Build surface and upper-air observation charts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gfs-hazards.yml'
      - 'requirements-observation-charts.txt'
      - 'scripts/build_observation_charts.py'
      - 'scripts/synoptic_features.py'
      - 'scripts/temporal_diagnostics.py'
      - 'scripts/airmass_regions.py'
      - 'scripts/cyclone_environment.py'
      - 'scripts/test_observation_charts.py'
      - 'scripts/test_synoptic_features.py'
      - 'scripts/test_temporal_diagnostics.py'
      - 'scripts/test_region_diagnostics.py'
      - 'scripts/diagnostic_math.py'
      - 'scripts/boundary_diagnostics.py'
      - 'scripts/feature_tracking.py'
      - 'scripts/replay_observation_case.py'
      - 'scripts/test_refinement.py'
      - 'scripts/test_chart_archive.mjs'
      - 'chart-review.js'
      - 'scripts/test_chart_review.mjs'
      - 'chart-archive.js'
  workflow_dispatch:
    inputs:
      observation_time:
        description: 'Optional surface UTC cycle (YYYY-MM-DDTHH:MM); 00/03/06/09/12/15/18/21. Upper-air uses preceding 00/12.'
        required: false
        type: string
  schedule:
    # Fallback until the external scheduler is deployed. GitHub can delay cron.
    - cron: '30 */3 * * *'

permissions:
  contents: write

concurrency:
  group: observation-charts
  cancel-in-progress: false

jobs:
  build-observation-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install observation decoding and contour support
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-observation-charts.txt
      - name: Check decoders and synoptic diagnostic rules
        run: |
          python scripts/test_observation_charts.py
          python scripts/test_synoptic_features.py
          python scripts/test_temporal_diagnostics.py
          python scripts/test_region_diagnostics.py
          python scripts/test_refinement.py
          node scripts/test_chart_archive.mjs
          node scripts/test_chart_review.mjs
      - name: Build surface, upper-air and synoptic diagnostics
        shell: bash
        env:
          OBSERVATION_TIME: ${{ inputs.observation_time }}
        run: |
          args=()
          if [ -n "${OBSERVATION_TIME:-}" ]; then
            if [[ ! "$OBSERVATION_TIME" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T(00|03|06|09|12|15|18|21):00$ ]]; then
              echo "::error::Invalid observation_time; expected YYYY-MM-DDTHH:00 at a three-hourly UTC cycle."
              exit 1
            fi
            # Builder derives the preceding 00/12 upper-air cycle separately.
            args=(--surface-time "$OBSERVATION_TIME")
          fi
          # Early feeds may not be published yet. Retry a failed/incomplete
          # build once, without adding extra scheduled trigger times. Preserve
          # partial successful updates if the other chart type is still late.
          chart_available=0
          for attempt in 1 2; do
            if python scripts/build_observation_charts.py "${args[@]}"; then
              chart_available=1
              if python -c 'import json,sys; d=json.load(open("assets/observation-charts/manifest.json")); sys.exit(0 if all(d.get("last_build", {}).get(k, {}).get("updated", False) for k in ("surface", "upper")) else 1)'; then
                exit 0
              fi
              echo "::warning::One chart type has insufficient early observations; retaining its previous chart."
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "Chart build failed or incomplete; retrying in 10 minutes."
              sleep 600
            fi
          done
          if [ "$chart_available" -eq 1 ]; then
            echo "::warning::Publishing the successfully updated chart types; other charts remain at their last valid times."
            exit 0
          fi
          echo "::error::Chart build failed after both attempts. Previous published charts were retained."
          exit 1
      - name: Commit generated observation charts
        shell: bash
        env:
          CHART_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/observation-charts
          if git diff --cached --quiet; then
            echo "No chart changes to publish."
            exit 0
          fi
          git commit -m 'Update surface and upper-air observation charts'
          # User uploads can advance the branch while the chart job runs.
          # Rebase only our generated commit; stop on conflicts rather than
          # overwriting remote changes or force-pushing.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$CHART_BRANCH"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              git pull --rebase origin "$CHART_BRANCH"
              sleep 5
            fi
          done
          echo "::error::Unable to publish chart commit after three attempts."
          exit 1
